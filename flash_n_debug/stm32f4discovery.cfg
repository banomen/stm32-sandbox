# OpenOCD для STM32F4DISCOVERY (STM32F407VG + встроенный ST-LINK/V2).
# Используется конфигурациями CLion из папки .run (OpenOCD Download & Run).

source [find interface/stlink.cfg]

transport select hla_swd

# рабочая область в ОЗУ для быстрой записи флеш-памяти
set WORKAREASIZE 0x10000

source [find target/stm32f4x.cfg]

reset_config srst_only
